[project]
name = "backend"
version = "0.1.0"
description = "SHOPDB2 FastAPI backend"
readme = "README.md"
authors = [
    { name = "wallgot", email = "wallgot@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "passlib>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false
